name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  public-tree:
    name: public-tree
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test public-tree boundaries
        shell: pwsh
        run: ./tests/ci/public-tree.Tests.ps1
      - name: Check public tree
        shell: pwsh
        run: ./scripts/check-public-tree.ps1

  installer:
    name: installer-${{ matrix.shell }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDKs for plugin dependency tests
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.404

      - name: Run installer regression tests
        run: ./tests/installer/relocate.Tests.ps1 -ResultPath installer-tests.json

      - name: Check plugin dependencies without AutoCAD
        run: ./tests/installer/plugin-payload.Tests.ps1 -ResultPath plugin-payload-tests.json

      - name: Run installer upgrade and rollback tests
        run: ./tests/installer/upgrade.Tests.ps1 -ResultPath upgrade-tests.json

      - name: Upload installer test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-tests-${{ matrix.shell }}
          path: |
            installer-tests.json
            plugin-payload-tests.json
            upgrade-tests.json
          if-no-files-found: warn

  # Windows, like the rest of the family: the gateway only runs beside AutoCAD, and
  # process identity, file locking and pipe tests rely on Windows semantics.
  server:
    name: server
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8 and .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.404

      - name: Build server
        run: dotnet build src/server/Bimwright.Dwg.Server.csproj -c Release

      - name: Run tests
        run: dotnet test tests/Bimwright.Dwg.Tests/Bimwright.Dwg.Tests.csproj -c Release

      - name: Run actual rewrite executor regression tests
        run: dotnet test tests/Bimwright.Dwg.Rewriting.Tests/Bimwright.Dwg.Rewriting.Tests.csproj -c Release

  toast-wpf:
    name: toast-wpf
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.404
      - name: WPF behavior on .NET 10
        run: dotnet run --project tests/Bimwright.Dwg.Toast.Tests -c Release -f net10.0-windows

  plugins:
    name: plugin-acad${{ matrix.acad }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - acad: "22"
            targetFramework: net48
          - acad: "23"
            targetFramework: net48
          - acad: "24"
            targetFramework: net48
          - acad: "25"
            targetFramework: net8.0-windows
          - acad: "26"
            targetFramework: net8.0-windows
          - acad: "27"
            targetFramework: net10.0-windows
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.404

      # AutoCAD references come from Autodesk's AutoCAD.NET NuGet packages, so every year builds here.
      - name: Build plugin
        run: dotnet build src/plugin-acad${{ matrix.acad }}/Bimwright.Dwg.Plugin.Acad${{ matrix.acad }}.csproj -c Release

      - name: Verify complete plugin payload
        shell: pwsh
        run: |
          . ./scripts/plugin-payload.ps1
          Assert-PluginPayload "src/plugin-acad${{ matrix.acad }}/bin/Release/${{ matrix.targetFramework }}" (2000 + [int]'${{ matrix.acad }}')

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-acad${{ matrix.acad }}
          path: src/plugin-acad${{ matrix.acad }}/bin/Release/${{ matrix.targetFramework }}/
