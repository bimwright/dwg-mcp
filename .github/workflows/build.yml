name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# A new push to a PR cancels its older run; master runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A PR that changes only Markdown or docs/ skips the heavy jobs below; master pushes always run everything.
  # Unit tests and the public-tree check still run, because some tests read the docs.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")
          if echo "$changed" | grep -qvE '(\.md$|^docs/)'; then code=true; else code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code changed: $code"

  public-tree:
    name: public-tree
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test public-tree boundaries
        shell: pwsh
        run: ./tests/ci/public-tree.Tests.ps1
      - name: Check public tree
        shell: pwsh
        run: ./scripts/check-public-tree.ps1

  installer:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: installer-${{ matrix.shell }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDKs for plugin dependency tests
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.404

      - name: Run installer regression tests
        run: ./tests/installer/relocate.Tests.ps1 -ResultPath installer-tests.json

      - name: Check plugin dependencies without AutoCAD
        run: ./tests/installer/plugin-payload.Tests.ps1 -ResultPath plugin-payload-tests.json

      - name: Run installer upgrade and rollback tests
        run: ./tests/installer/upgrade.Tests.ps1 -ResultPath upgrade-tests.json

      - name: Upload installer test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-tests-${{ matrix.shell }}
          path: |
            installer-tests.json
            plugin-payload-tests.json
            upgrade-tests.json
          if-no-files-found: warn

  # Windows, like the rest of the family: the gateway only runs beside AutoCAD, and
  # process identity, file locking and pipe tests rely on Windows semantics.
  server:
    name: server
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8 and .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.404

      - name: Build server
        run: dotnet build src/server/Bimwright.Dwg.Server.csproj -c Release

      - name: Run tests
        run: dotnet test tests/Bimwright.Dwg.Tests/Bimwright.Dwg.Tests.csproj -c Release

      - name: Run actual rewrite executor regression tests
        run: dotnet test tests/Bimwright.Dwg.Rewriting.Tests/Bimwright.Dwg.Rewriting.Tests.csproj -c Release

  toast-wpf:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: toast-wpf
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.404
      - name: WPF behavior on .NET 10
        run: dotnet run --project tests/Bimwright.Dwg.Toast.Tests -c Release -f net10.0-windows

  plugins:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: plugin-acad${{ matrix.acad }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - acad: "22"
            targetFramework: net48
          - acad: "23"
            targetFramework: net48
          - acad: "24"
            targetFramework: net48
          - acad: "25"
            targetFramework: net8.0-windows
          - acad: "26"
            targetFramework: net8.0-windows
          - acad: "27"
            targetFramework: net10.0-windows
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.404

      # AutoCAD references come from Autodesk's AutoCAD.NET NuGet packages, so every year builds here.
      - name: Build plugin
        run: dotnet build src/plugin-acad${{ matrix.acad }}/Bimwright.Dwg.Plugin.Acad${{ matrix.acad }}.csproj -c Release

      - name: Verify complete plugin payload
        shell: pwsh
        run: |
          . ./scripts/plugin-payload.ps1
          Assert-PluginPayload "src/plugin-acad${{ matrix.acad }}/bin/Release/${{ matrix.targetFramework }}" (2000 + [int]'${{ matrix.acad }}')

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-acad${{ matrix.acad }}
          path: src/plugin-acad${{ matrix.acad }}/bin/Release/${{ matrix.targetFramework }}/

  # The one required check for master: green when every job passed or was skipped for a docs-only PR.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, public-tree, installer, server, toast-wpf, plugins]
    runs-on: ubuntu-latest
    steps:
      - name: Fail when any job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - name: All jobs passed or were skipped
        run: echo ok
